name: Upload release assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download build artifacts
        env:
          MAC_URL: ${{ secrets.MAC_ARTIFACT_URL }}
          WIN_URL: ${{ secrets.WIN_ARTIFACT_URL }}
        run: |
          set -euo pipefail
          mkdir -p out/windows
          curl -fsSL "$MAC_URL" -o mac-dist.zip
          curl -fsSL "$WIN_URL" -o windows-dist.zip
          shasum -a 256 mac-dist.zip windows-dist.zip
          unzip -q mac-dist.zip -d out
          unzip -q windows-dist.zip -d out/windows
          ls -lR out

      - name: Prepare macOS manifest
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const dir = 'out';
          const dmg = fs.readdirSync(dir).find((name) => name.endsWith('.dmg'));
          if (!dmg) throw new Error('DMG introuvable');
          const bytes = fs.readFileSync(dir + '/' + dmg);
          const manifest = {
            version: '0.1.1',
            notes: 'Améliorations et corrections.',
            publishedAt: new Date().toISOString(),
            downloadUrl: 'https://github.com/RollTrayy/bards-cue-releases/releases/latest/download/' + encodeURIComponent(dmg),
            sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
            size: bytes.length,
          };
          fs.writeFileSync(dir + '/latest.json', JSON.stringify(manifest, null, 2) + '\n');
          console.log(manifest);
          NODE

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload v0.1.1 \
            out/*.dmg \
            out/latest.json \
            out/windows/latest.yml \
            out/windows/*.exe \
            out/windows/*.blockmap \
            --clobber \
            --repo RollTrayy/bards-cue-releases
